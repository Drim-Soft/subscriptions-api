<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Factura creada - Subscriptions API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      color: #1f2937;
    }
    form {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      max-width: 400px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 1rem;
      color: #374151;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 1rem;
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #1e40af;
    }
    #factura {
      margin-top: 2rem;
      background: white;
      padding: 1rem;
      border-radius: 8px;
      max-width: 400px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Crear nueva factura</h1>
  <form id="invoiceForm">
    <label>Monto:</label>
    <input type="number" id="amount" required />
    <label>ID de Suscripción:</label>
    <input type="number" id="subscriptionId" required />
    <label>ID de Moneda:</label>
    <input type="number" id="currencyId" required />
    <label>ID de Estado:</label>
    <input type="number" id="subscriptionStatusId" required />
    <label>ID de Método de Pago:</label>
    <input type="number" id="paymentMethodId" required />
    <button type="submit">Crear Factura</button>
  </form>

  <div id="factura" class="hidden">
    <h2>Factura creada correctamente ✅</h2>
    <p><strong>ID:</strong> <span id="idFactura"></span></p>
    <p><strong>Monto:</strong> <span id="monto"></span></p>
    <p><strong>Fecha:</strong> <span id="fecha"></span></p>
  </div>

  <script>
    const form = document.getElementById("invoiceForm");
    const facturaDiv = document.getElementById("factura");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const invoice = {
        amount: parseFloat(document.getElementById("amount").value),
        date: new Date().toISOString(),
        subscriptionId: parseInt(document.getElementById("subscriptionId").value),
        currencyId: parseInt(document.getElementById("currencyId").value),
        subscriptionStatusId: parseInt(document.getElementById("subscriptionStatusId").value),
        paymentMethodId: parseInt(document.getElementById("paymentMethodId").value),
      };

      try {
        const response = await fetch("http://localhost:5096/api/invoice", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(invoice),
        });

        if (!response.ok) throw new Error("Error al crear factura");

        const data = await response.json();

        // Mostrar la factura creada
        document.getElementById("idFactura").textContent = data.idInvoice;
        document.getElementById("monto").textContent = data.amount;
        document.getElementById("fecha").textContent = new Date(data.date).toLocaleString();
        facturaDiv.classList.remove("hidden");

        form.reset();
      } catch (error) {
        alert("Error: " + error.message);
      }
    });
  </script>
</body>
</html>
